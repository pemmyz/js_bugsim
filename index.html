<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bug Invasion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="garden"></div>

    <div class="ui-container">
        <button id="fullscreenBtn" class="fullscreen-btn">ENTER FULLSCREEN</button>
        <div class="status-text">Bugs are swarming...</div>
    </div>

    <button id="optionsBtn" class="options-btn hide-in-fullscreen">⚙️ OPTIONS (O)</button>

    <div id="optionsMenu" class="options-menu hidden hide-in-fullscreen">
        <h3>Settings</h3>
        
        <label>
            Amount of Bugs: <span id="amountDisplay">120</span>
            <input type="range" id="amountInput" min="5" max="300" step="5" value="120">
        </label>
        
        <label>
            Bug Speed: <span id="speedDisplay">1x</span>
            <input type="range" id="speedInput" min="0.1" max="5" step="0.1" value="1">
        </label>
        
        <label>
            Bug Size: <span id="sizeDisplay">1x</span>
            <input type="range" id="sizeInput" min="0.1" max="4" step="0.1" value="1">
        </label>
        
        <label class="toggle-label">
            Follow Mouse
            <input type="checkbox" id="followMouseToggle">
        </label>
        
        <label class="toggle-label">
            Dark Mode (Black Bugs)
            <input type="checkbox" id="darkModeToggle">
        </label>

        <!-- Background & Colors Section -->
        <div class="color-section">
            <h3 class="section-title">Background & Colors</h3>
            
            <label class="toggle-label">
                Invert Bug Colors
                <input type="checkbox" id="invertBugsToggle">
            </label>

            <!-- NEW: Negative of Background Toggle -->
            <label class="toggle-label" title="Makes bugs the exact opposite color of the background">
                Negative of Background
                <input type="checkbox" id="negativeBgToggle">
            </label>

            <div class="quick-colors-container">
                <span>Quick Backgrounds:</span>
                <div class="quick-colors">
                    <!-- Default Image -->
                    <button class="quick-color-btn" id="btn-default-bg" style="background-color: #ecf0f1; display:flex; align-items:center; justify-content:center;" title="Default Image">🖼️</button>
                    <!-- Basic Colors -->
                    <button class="quick-color-btn" style="background-color: #ffffff;" data-color="#ffffff"></button>
                    <button class="quick-color-btn" style="background-color: #ff0000;" data-color="#ff0000"></button>
                    <button class="quick-color-btn" style="background-color: #00ff00;" data-color="#00ff00"></button>
                    <button class="quick-color-btn" style="background-color: #0000ff;" data-color="#0000ff"></button>
                    <!-- Grey BG + Black Bug -->
                    <button class="quick-color-btn" id="btn-grey-black" style="background-color: #808080; display:flex; align-items:center; justify-content:center;" title="Grey BG + Black Bugs">
                        <div style="width: 10px; height: 10px; background-color: black; border-radius: 50%;"></div>
                    </button>
                </div>
            </div>

            <!-- Custom Color Picker -->
            <label class="custom-color-label">
                ➕ Custom Background Color
                <input type="color" id="bgColorPicker" value="#ecf0f1">
            </label>
        </div>
        
        <button id="closeOptionsBtn">Close</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
